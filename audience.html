<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LinguaLive — Listen</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
:root{--bg:#0d0d14;--card:#15151f;--card2:#1c1c28;--bdr:#2a2a3a;--txt:#f0f0f8;--mut:#5a5a7a;--acc:#4d9eff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;transition:opacity 0.4s,transform 0.4s;overflow-y:auto;}
.scr.hide{opacity:0;pointer-events:none;transform:translateY(20px);}
/* Welcome */
#s1{gap:20px;}
.logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--acc),#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 32px rgba(77,158,255,0.3);animation:fl 3s ease-in-out infinite;}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.wtitle{font-size:28px;font-weight:800;letter-spacing:-1px;text-align:center;line-height:1.1;}
.wtitle span{color:var(--acc);}
.wsub{font-size:13px;color:var(--mut);text-align:center;line-height:1.6;max-width:260px;}
.sbadge{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:11px 16px;text-align:center;width:100%;max-width:280px;}
.sbadge label{display:block;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:3px;}
.sbadge .code{font-size:20px;font-weight:700;letter-spacing:4px;color:var(--acc);}
.spin-w{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mut);}
.spin{width:24px;height:24px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.ctabtn{width:100%;max-width:300px;background:var(--acc);border:none;border-radius:12px;color:#fff;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;padding:14px;cursor:pointer;box-shadow:0 8px 24px rgba(77,158,255,0.28);transition:opacity 0.2s;}
.ctabtn:hover{opacity:0.9;}
/* Lang picker */
#s2{gap:0;padding-top:40px;justify-content:flex-start;}
.pick-header{width:100%;max-width:400px;padding:0 0 16px;}
.ptitle{font-size:20px;font-weight:700;text-align:center;}
.psub{font-size:12px;color:var(--mut);text-align:center;margin-top:4px;}
.lang-grid{width:100%;max-width:400px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-bottom:20px;}
.lbtn{width:100%;border-radius:14px;border:1px solid rgba(255,255,255,0.08);padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform 0.15s,border-color 0.2s;text-align:left;background:rgba(255,255,255,0.04);}
.lbtn:active{transform:scale(0.97);}
.lbtn:hover{border-color:rgba(255,255,255,0.2);}
.lfl{font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));}
.li{flex:1;}
.len{font-size:15px;font-weight:700;color:var(--txt);}
.lnat{font-size:11px;margin-top:1px;opacity:0.5;color:var(--txt);}
.larr{font-size:16px;opacity:0.2;color:var(--txt);}
/* Listening */
#s3{padding:0;justify-content:flex-start;overflow-y:auto;}
.lbg{position:fixed;inset:0;transition:background 0.5s;z-index:0;}
.lwrap{position:relative;z-index:1;width:100%;min-height:100%;display:flex;flex-direction:column;padding-bottom:90px;}
.topbar{padding:48px 20px 12px;display:flex;align-items:center;justify-content:space-between;}
.lchip{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.15);font-size:11px;font-weight:700;color:var(--txt);background:rgba(255,255,255,0.07);}
.crow{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--mut);}
.cdot.live{background:#3dffa0;box-shadow:0 0 7px #3dffa0;animation:gl 2s infinite;}
@keyframes gl{0%,100%{opacity:1}50%{opacity:0.5}}
.wrow{padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:4px;height:60px;opacity:0.35;transition:opacity 0.3s;}
.wrow.act{opacity:1;}
.wb{width:4px;border-radius:2px;background:var(--acc);height:4px;transition:height 0.1s ease;}
.tarea{padding:0 20px;flex:1;}
.ccard{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:20px;margin-bottom:11px;min-height:90px;transition:border-color 0.3s;}
.ccard.active{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);}
.clbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:9px;}
.mtxt{font-size:20px;font-weight:500;line-height:1.5;min-height:40px;}
.blink::after{content:'▍';animation:bc 0.7s infinite;font-size:16px;vertical-align:middle;color:var(--acc);}
@keyframes bc{0%,100%{opacity:1}50%{opacity:0}}
.ocard{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:11px;padding:12px 15px;margin-bottom:10px;}
.olbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:4px;}
.otxt{font-size:13px;color:rgba(255,255,255,0.35);line-height:1.5;}
.schip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.07);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--mut);margin-bottom:11px;}
.sdot2{width:5px;height:5px;border-radius:50%;background:var(--acc);}
.harea{padding:0 20px;}
.hlbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:8px;}
.hitem{background:rgba(255,255,255,0.03);border-radius:9px;padding:10px 13px;margin-bottom:7px;border-left:2px solid rgba(255,255,255,0.1);}
.ht{font-size:13px;line-height:1.5;margin-bottom:3px;}
.ho{font-size:12px;color:var(--mut);}
.htm{font-size:10px;color:var(--bdr);margin-top:2px;}
.bbar{position:fixed;bottom:0;left:0;right:0;padding:12px 20px 26px;background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;align-items:center;gap:10px;z-index:10;}
.abtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt);transition:all 0.2s;}
.abtn.off{opacity:0.5;}
.swbtn{padding:12px 15px;border-radius:12px;border:1px solid var(--bdr);background:var(--card);color:var(--mut);font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.swbtn:hover{color:var(--txt);border-color:var(--acc);}
</style>
</head>
<body>
<div class="scr" id="s1">
  <div class="logo">🌐</div>
  <div class="wtitle">Welcome to<br><span>LinguaLive</span></div>
  <div class="wsub">Real-time AI translation into your language, spoken through your earphones.</div>
  <div class="sbadge" id="sbadge" style="display:none"><label>Session</label><div class="code" id="dcode">——</div></div>
  <div class="spin-w" id="spinW"><div class="spin"></div><span style="font-size:12px">Connecting…</span></div>
  <button class="ctabtn" id="ctaBtn" style="display:none" onclick="goLang()">Choose My Language →</button>
</div>

<div class="scr hide" id="s2">
  <div class="pick-header">
    <div class="ptitle">Choose Your Language</div>
    <div class="psub">Translations delivered live to your earphones</div>
  </div>
  <div class="lang-grid" id="langGrid"></div>
</div>

<div class="scr hide" id="s3">
  <div class="lbg" id="lbg"></div>
  <div class="lwrap">
    <div class="topbar">
      <div class="lchip" id="lchip">—</div>
      <div class="crow"><div class="cdot" id="cdot"></div><span id="ctxt">Connecting…</span></div>
    </div>
    <div class="wrow" id="wrow"></div>
    <div class="tarea">
      <div class="schip" id="schip" style="display:none"><div class="sdot2"></div><span id="sname">Speaker A</span></div>
      <div class="ccard" id="ccard">
        <div class="clbl">TRANSLATION</div>
        <div class="mtxt" id="mtxt"><span style="color:var(--mut);font-size:15px">Waiting for broadcast…</span></div>
      </div>
      <div class="ocard" id="ocard" style="display:none">
        <div class="olbl">Original · English</div>
        <div class="otxt" id="otxt"></div>
      </div>
    </div>
    <div class="harea" id="harea" style="display:none">
      <div class="hlbl">Previous</div>
      <div id="hlist"></div>
    </div>
  </div>
  <div class="bbar">
    <button class="abtn" id="abtn" onclick="togAudio()">🎧 Audio On</button>
    <button class="swbtn" onclick="goLang()">Switch ⌄</button>
  </div>
</div>

<script>
const LANGS={
  zh:{name:'Mandarin',native:'普通话',flag:'🇨🇳',voice:'pNInz6obpgDQGcFmaJgB',bcp:'zh-CN'},
  yue:{name:'Cantonese',native:'粵語',flag:'🇭🇰',voice:'pNInz6obpgDQGcFmaJgB',bcp:'zh-HK'},
  ko:{name:'Korean',native:'한국어',flag:'🇰🇷',voice:'ErXwobaYiN019PkySvjV',bcp:'ko-KR'},
  de:{name:'German',native:'Deutsch',flag:'🇩🇪',voice:'VR6AewLTigWG4xSOukaG',bcp:'de-DE'},
  id:{name:'Indonesian',native:'Bahasa Indonesia',flag:'🇮🇩',voice:'pNInz6obpgDQGcFmaJgB',bcp:'id-ID'},
  tl:{name:'Filipino',native:'Tagalog',flag:'🇵🇭',voice:'pNInz6obpgDQGcFmaJgB',bcp:'fil-PH'},
  th:{name:'Thai',native:'ภาษาไทย',flag:'🇹🇭',voice:'pNInz6obpgDQGcFmaJgB',bcp:'th-TH'},
  km:{name:'Khmer',native:'ខ្មែរ',flag:'🇰🇭',voice:'pNInz6obpgDQGcFmaJgB',bcp:'km-KH'},
  vi:{name:'Vietnamese',native:'Tiếng Việt',flag:'🇻🇳',voice:'pNInz6obpgDQGcFmaJgB',bcp:'vi-VN'},
  hi:{name:'Hindi',native:'हिन्दी',flag:'🇮🇳',voice:'pNInz6obpgDQGcFmaJgB',bcp:'hi-IN'},
  ru:{name:'Russian',native:'Русский',flag:'🇷🇺',voice:'VR6AewLTigWG4xSOukaG',bcp:'ru-RU'},
  uk:{name:'Ukrainian',native:'Українська',flag:'🇺🇦',voice:'pNInz6obpgDQGcFmaJgB',bcp:'uk-UA'}
};

const P=new URLSearchParams(window.location.search);
const SID=P.get('s');
let lang=null,elKey='',audioOn=true,audioUnlocked=false;
let ably=null,bch=null,pch=null,curAudio=null,hist=[];

function g(id){return document.getElementById(id);}

// Build language grid
function buildGrid(){
  g('langGrid').innerHTML=Object.entries(LANGS).map(([k,v])=>`
    <button class="lbtn" onclick="pick('${k}')">
      <div class="lfl">${v.flag}</div>
      <div class="li"><div class="len">${v.name}</div><div class="lnat">${v.native}</div></div>
      <div class="larr">›</div>
    </button>`).join('');
}

window.onload=async()=>{
  buildGrid();
  const wr=g('wrow');
  for(let i=0;i<32;i++){const b=document.createElement('div');b.className='wb';b.id='wb'+i;wr.appendChild(b);}
  if(!SID){g('spinW').innerHTML='<div style="font-size:13px;color:#ff6b6b;text-align:center">⚠ No session found.<br>Please scan the QR code again.</div>';return;}
  g('sbadge').style.display='block';g('dcode').textContent=SID;
  await loadConfigAndConnect();
};

async function loadConfigAndConnect(){
  try{
    const r=await fetch('/.netlify/functions/config');
    if(!r.ok)throw new Error('Config failed');
    const cfg=await r.json();
    elKey=cfg.elevenKey||'';
    await connectAbly(cfg.ablyKey);
  }catch(e){
    g('spinW').innerHTML='<div style="font-size:13px;color:var(--mut);text-align:center">Connection failed.<br>Please scan QR code again.</div>';
    g('ctaBtn').style.display='block';
  }
}

async function connectAbly(ablyKey){
  if(!ablyKey)throw new Error('No Ably key');
  ably=new Ably.Realtime({key:ablyKey});
  await new Promise((res,rej)=>{ably.connection.on('connected',res);ably.connection.on('failed',rej);setTimeout(rej,8000);});
  bch=ably.channels.get('ll-'+SID);
  pch=ably.channels.get('llp-'+SID);
  bch.subscribe('start',()=>{g('cdot').classList.add('live');g('ctxt').textContent='Live';});
  bch.subscribe('end',()=>{g('cdot').classList.remove('live');g('ctxt').textContent='Session ended';});
  bch.subscribe('t',msg=>lang&&handleT(msg.data));
  g('spinW').style.display='none';g('ctaBtn').style.display='block';
}

function goLang(){show('s2');}

function pick(l){
  if(lang&&pch)pch.publish('leave',{lang});
  lang=l;
  if(pch)pch.publish('join',{lang:l});
  theme(l);show('s3');updAbtn();
  unlockAudio();
}

function theme(l){
  const v=LANGS[l];
  g('lbg').style.background='radial-gradient(ellipse at 20% 20%,rgba(77,158,255,0.06),transparent 60%)';
  const chip=g('lchip');chip.textContent=v.flag+' '+v.name;
  document.querySelectorAll('.wb').forEach(b=>b.style.background='var(--acc)');
}

function handleT(msg){
  const txt=msg.tr[lang];if(!txt)return;
  const prev=g('mtxt').dataset.t;
  if(prev&&!prev.includes('Waiting'))addHist(prev,msg.orig||'');
  if(msg.spk){g('schip').style.display='inline-flex';g('sname').textContent=msg.spk;}
  g('ocard').style.display='block';g('otxt').textContent=msg.orig||'';
  const card=g('ccard');card.className='ccard active';
  const mt=g('mtxt');
  mt.className='mtxt blink';
  mt.textContent=txt;mt.dataset.t=txt;
  setTimeout(()=>mt.classList.remove('blink'),900);
  animWave();
  if(audioOn&&elKey)speakEL(txt,lang);
  else if(audioOn)speakBrowser(txt,lang);
}

function addHist(tr,orig){
  hist.unshift({tr,orig,t:new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})});
  if(hist.length>8)hist.pop();
  const a=g('harea');a.style.display='block';
  g('hlist').innerHTML=hist.map(h=>`<div class="hitem"><div class="ht">${h.tr}</div><div class="ho">${h.orig}</div><div class="htm">${h.t}</div></div>`).join('');
}

function animWave(){
  const wr=g('wrow');wr.classList.add('act');
  let t=0;const iv=setInterval(()=>{
    t++;for(let i=0;i<32;i++){const b=g('wb'+i);if(b)b.style.height=(4+Math.abs(Math.sin((t*0.15)+i*0.4))*46)+'px';}
    if(t>40){clearInterval(iv);wr.classList.remove('act');document.querySelectorAll('.wb').forEach(b=>b.style.height='4px');}
  },60);
}

function unlockAudio(){
  if(audioUnlocked)return;
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const buf=ctx.createBuffer(1,1,22050);
    const src=ctx.createBufferSource();
    src.buffer=buf;src.connect(ctx.destination);src.start(0);
    ctx.resume().then(()=>{audioUnlocked=true;});
  }catch(e){audioUnlocked=true;}
}

async function speakEL(txt,l){
  try{
    if(curAudio){curAudio.pause();curAudio=null;}
    const voiceId=LANGS[l]?.voice||'pNInz6obpgDQGcFmaJgB';
    const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}/stream`,{
      method:'POST',
      headers:{'Content-Type':'application/json','xi-api-key':elKey},
      body:JSON.stringify({text:txt,model_id:'eleven_multilingual_v2',voice_settings:{stability:0.5,similarity_boost:0.75}})
    });
    if(!r.ok)throw new Error('EL '+r.status);
    const url=URL.createObjectURL(await r.blob());
    curAudio=new Audio(url);
    curAudio.play().catch(e=>{
      const retry=()=>{curAudio&&curAudio.play();document.removeEventListener('touchstart',retry);};
      document.addEventListener('touchstart',retry,{once:true});
    });
    updAbtn(true);curAudio.onended=()=>updAbtn(false);
  }catch(e){console.error(e);speakBrowser(txt,l);}
}

function speakBrowser(txt,l){
  if(!('speechSynthesis'in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=LANGS[l]?.bcp||'en';u.rate=0.9;
  window.speechSynthesis.speak(u);
}

function togAudio(){
  audioOn=!audioOn;
  if(!audioOn&&curAudio){curAudio.pause();curAudio=null;}
  updAbtn();
}

function updAbtn(playing){
  const b=g('abtn');
  b.className='abtn'+(audioOn?'':' off');
  b.textContent=!audioOn?'🔇 Audio Off':playing?'🔊 Playing…':'🎧 Audio On';
}

function show(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('hide',s.id!==id));
  if(id==='s2'&&lang&&pch){pch.publish('leave',{lang});lang=null;}
}

window.addEventListener('beforeunload',()=>{if(lang&&pch)pch.publish('leave',{lang});});
</script>
</body>
</html>
